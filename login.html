<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4 relative">
    <div class="w-full max-w-300 bg-white rounded-3xl overflow-hidden shadow-xl items-center flex flex-col md:flex-row">
        <!-- Left Section -->
        <div class="w-full md:w-1/2 relative">
            <a href="#" class="absolute top-6 left-6 text-white text-2xl font-bold z-10">shop-krest</a>
            <a href="/index.html" class="absolute top-6 right-6 bg-white/10 backdrop-blur-sm text-white px-4 py-2 rounded-full text-sm hover:bg-white/20 transition-colors z-10">
                Back to website →
            </a>
            <div class="relative h-full">
                <img src="/images/loginimg.jpg"
                     class="w-full h-full object-cover">
                <!-- Overlay changé en bleu -->
                <div class="absolute inset-0 bg-blue-900/30"></div>
                <div class="absolute bottom-12 left-12 text-white">
                    <h2 class="text-2xl md:text-4xl font-semibold mb-2">Capturing Moments,</h2>
                    <h2 class="text-2xl md:text-4xl font-semibold">Creating Memories</h2>
                    <div class="flex gap-2 mt-6">
                        <div class="w-4 h-1 bg-white/30 rounded"></div>
                        <div class="w-4 h-1 bg-white/30 rounded"></div>
                        <div class="w-4 h-1 bg-white rounded"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Section (Interactive / Functional Side) -->
        <div class="w-full md:w-1/2 p-6 md:p-12">
            <div class="max-w-md mx-auto">
                <h1 class="text-gray-800 font-inter text-2xl md:text-4xl font-semibold mb-2">Login your account</h1>
                <p class="text-gray-400 mb-8">
                    Don't have an account?
                    <a href="/register.html" class="text-gray-900 hover:underline">Register</a>
                </p>

                <form id="loginForm" class="space-y-8">
                    <!-- Focus ring bleu -->
                    <input type="text" id="userName" placeholder="username" class="w-full bg-gray-100 text-gray-900 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    <div class="relative">
                        <!-- Focus ring bleu -->
                        <input type="password" id="password" placeholder="Enter your password" class="w-full bg-gray-100 text-gray-900  rounded-lg p-3 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-600">
                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>

                    <label class="flex items-center space-x-2 cursor-pointer">
                        <!-- Checkbox bleu -->
                        <input type="checkbox" class="rounded bg-[#1c1c24] border-gray-600 text-blue-600 focus:ring-blue-600">
                        <span class="text-gray-600">Remember me</span>
                    </label>

                    <!-- Bouton bleu -->
                    <button id="loginBtn" type="submit" class="w-full bg-gray-600 text-white rounded-lg p-3 hover:bg-gray-900 transition-colors">
                        Login
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div class="hidden fixed top-5 right-5 px-6 py-4 rounded-lg text-white text-sm font-medium shadow-lg z-9999 transition-all duration-300" id="toast"></div>

    <script src="login.js"></script>
</body>
</html>
